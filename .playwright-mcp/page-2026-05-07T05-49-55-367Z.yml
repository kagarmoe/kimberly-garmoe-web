      - paragraph [ref=e18]: "Pursinator is a collection management system designed to help users evaluate and refine what they own. Initially focused on handbags and accessories, the underlying model is broader: a system for curation, ranking, and preference mapping across any collection."
      - paragraph [ref=e19]: The core problem it solves is not inventory — it's decision support. What stays? What goes? What deserves a closer look?
